name: Deploy Cloudflare staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --test --test-timeout=60000

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the staging CLOUDFLARE_API_TOKEN secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set the staging CLOUDFLARE_ACCOUNT_ID variable.'; exit 1; }
          node scripts/check-staging.mjs --config-only
      - name: Install the pinned deployment tool without install scripts
        run: npm ci --prefix .github/deploy --ignore-scripts --no-audit --no-fund
      - name: Apply staging migrations and deploy the tested commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node .github/deploy/node_modules/wrangler/bin/wrangler.js d1 migrations apply bananapayserver-staging --remote -c wrangler.staging.jsonc
          node .github/deploy/node_modules/wrangler/bin/wrangler.js deploy -c wrangler.staging.jsonc --message "GitHub Actions: $GITHUB_SHA"
      - name: Check the public boundary
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
        run: node scripts/check-staging.mjs
